<!DOCTYPE html>
<!-- 部分提示词设计借鉴 Study-Mate (MIT © 2026 Cattofu) https://github.com/Miaotofu01/Study-Mate -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伴学 · AI 学习空间</title>
<style>
:root{
  --ink:#1a1410;
  --panel:rgba(36,26,22,.90);
  --panel-2:rgba(48,35,29,.95);
  --line:#7a5c44;
  --line-2:#a88460;
  --cream:#f6e8d2;
  --cream-dim:#c9b39a;
  --amber:#ffc861;
  --amber-dim:#c9973f;
  --ok:#8fbf6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  background:#120e0b;color:var(--cream);
  overflow:hidden;user-select:none;
}

/* ============ 场景层 ============ */
.scene{
  position:fixed;inset:0;
  overflow:hidden;
  transition:filter .3s;
  /* 常驻底图，任何时刻都有画面（加载期兜底） */
  background:url('bg.jpg') center 38%/cover no-repeat;
}
.scene::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(10,6,4,.55) 100%);
}
.scene.dim{filter:brightness(.62) saturate(.9)}

/* 场景帧图层：所有帧常驻 DOM，只切 opacity，不再替换 background-image */
.scene-layer{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center 38%;
  opacity:0;transition:opacity .38s ease;
  pointer-events:none;
}
.scene-layer.show{opacity:1}

/* 人物热区 */
.hotspot{
  position:fixed;left:50%;top:47%;width:26%;height:46%;
  transform:translate(-50%,-50%);
  border-radius:12px;cursor:pointer;
  transition:background .2s;
  display:flex;align-items:flex-start;justify-content:center;
}
.hotspot:hover{background:rgba(255,200,97,.07)}
.hotspot .hint{
  margin-top:6px;padding:5px 12px;
  background:var(--panel);border:2px solid var(--line-2);
  color:var(--amber);font-size:13px;letter-spacing:2px;
  opacity:0;transform:translateY(-6px);transition:all .22s;
  pointer-events:none;box-shadow:3px 3px 0 rgba(0,0,0,.45);
}
.hotspot:hover .hint{opacity:1;transform:translateY(0)}
.hotspot.hidden{opacity:0;pointer-events:none}

/* ============ 辐射菜单 ============ */
.radial{
  position:fixed;left:50%;top:47%;
  width:0;height:0;pointer-events:none;z-index:40;
}
.radial.open{pointer-events:auto}
.radial-item{
  position:absolute;left:0;top:0;
  width:104px;height:56px;
  margin:-28px 0 0 -52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--panel-2);
  border:2px solid var(--line-2);
  color:var(--cream);
  font-size:12px;letter-spacing:1px;cursor:pointer;
  box-shadow:4px 4px 0 rgba(0,0,0,.5);
  opacity:0;transform:scale(.3);pointer-events:auto;
  transition:transform .34s cubic-bezier(.34,1.56,.64,1),opacity .22s,background .15s,border-color .15s;
}
.radial-item .ic{font-size:17px;line-height:1}
.radial.open .radial-item{opacity:1}
.radial-item:hover{background:#5a3f2e;border-color:var(--amber);color:var(--amber)}
.radial-item:active{transform:var(--tf) scale(.94)!important}

/* 展开位置：6 个方向 */
.radial.open .ri-1{--tf:translate(-50%,-50%) rotate(-90deg) translateY(-168px) rotate(90deg);transform:var(--tf)}
.radial.open .ri-2{--tf:translate(-50%,-50%) rotate(-30deg) translateY(-168px) rotate(30deg);transform:var(--tf)}
.radial.open .ri-3{--tf:translate(-50%,-50%) rotate(30deg) translateY(-168px) rotate(-30deg);transform:var(--tf)}
.radial.open .ri-4{--tf:translate(-50%,-50%) rotate(90deg) translateY(-152px) rotate(-90deg);transform:var(--tf)}
.radial.open .ri-5{--tf:translate(-50%,-50%) rotate(150deg) translateY(-168px) rotate(-150deg);transform:var(--tf)}
.radial.open .ri-6{--tf:translate(-50%,-50%) rotate(210deg) translateY(-168px) rotate(-210deg);transform:var(--tf)}
@media (max-height: 700px){
  .radial.open .ri-1{--tf:translate(-50%,-50%) rotate(-90deg) translateY(-132px) rotate(90deg)}
  .radial.open .ri-2{--tf:translate(-50%,-50%) rotate(-30deg) translateY(-132px) rotate(30deg)}
  .radial.open .ri-3{--tf:translate(-50%,-50%) rotate(30deg) translateY(-132px) rotate(-30deg)}
  .radial.open .ri-4{--tf:translate(-50%,-50%) rotate(90deg) translateY(-120px) rotate(-90deg)}
  .radial.open .ri-5{--tf:translate(-50%,-50%) rotate(150deg) translateY(-132px) rotate(-150deg)}
  .radial.open .ri-6{--tf:translate(-50%,-50%) rotate(210deg) translateY(-132px) rotate(-210deg)}
}

/* ============ 右上角工具栏 ============ */
.topbar{position:fixed;right:22px;top:22px;z-index:35;display:flex;gap:9px}
.topbar .icon-btn{
  width:46px;height:46px;font-size:20px;
  background:var(--panel);border:2px solid var(--line);
  box-shadow:3px 3px 0 rgba(0,0,0,.45);
}
.topbar .icon-btn:hover{background:#5a3f2e;border-color:var(--amber);color:var(--amber)}

/* ============ To-Do 面板 ============ */
.todo{
  position:fixed;left:22px;top:22px;width:268px;z-index:30;
  background:var(--panel);border:3px solid var(--line);
  box-shadow:6px 6px 0 rgba(0,0,0,.45);
}
.todo-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-bottom:2px solid var(--line);
  font-size:13px;letter-spacing:2px;color:var(--amber);
}
.todo-hd .cnt{font-size:11px;color:var(--cream-dim);letter-spacing:0}
.todo-body{max-height:260px;overflow-y:auto}
.todo-empty{padding:14px 12px;font-size:12px;color:var(--cream-dim);text-align:center}
.todo-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 12px;font-size:13px;line-height:1.4;
  border-bottom:1px solid rgba(122,92,68,.35);
}
.todo-item:hover{background:rgba(255,200,97,.06)}
.todo-item .box{
  flex:0 0 15px;width:15px;height:15px;margin-top:2px;
  border:2px solid var(--line-2);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink);
}
.todo-item.done .box{background:var(--ok);border-color:var(--ok)}
.todo-item.done .box::after{content:'✓'}
.todo-item.done .txt{text-decoration:line-through;color:var(--cream-dim)}
.todo-item .txt{flex:1;word-break:break-word}
.todo-item .del{
  opacity:0;cursor:pointer;color:var(--cream-dim);font-size:14px;line-height:1;
  padding:0 2px;transition:opacity .15s,color .15s;
}
.todo-item:hover .del{opacity:1}
.todo-item .del:hover{color:#e07a5f}
.todo-add{display:flex;border-top:2px solid var(--line)}
.todo-add input{
  flex:1;background:transparent;border:none;outline:none;
  padding:10px 12px;color:var(--cream);font-size:13px;
  font-family:inherit;
}
.todo-add input::placeholder{color:#8a7562}
.todo-add button{
  background:transparent;border:none;border-left:2px solid var(--line);
  color:var(--amber);padding:0 14px;cursor:pointer;font-size:16px;
  font-family:inherit;transition:background .15s;
}
.todo-add button:hover{background:rgba(255,200,97,.12)}

/* ============ 右侧栏 ============ */
.sidebar{
  position:fixed;right:0;top:0;bottom:0;width:390px;z-index:50;
  background:var(--panel-2);border-left:3px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 24px rgba(0,0,0,.5);
}
.sidebar.open{transform:translateX(0)}
.sb-hd{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;border-bottom:2px solid var(--line);
}
.sb-hd .title{flex:1;font-size:14px;letter-spacing:2px;color:var(--amber)}
.icon-btn{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:2px solid var(--line);color:var(--cream);
  cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s;
}
.icon-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(255,200,97,.1)}
.sb-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:10px 12px;font-size:13px;line-height:1.65;word-break:break-word}
.msg.ai{align-self:flex-start;background:rgba(255,200,97,.10);border:2px solid var(--line);border-left:3px solid var(--amber)}
.msg.me{align-self:flex-end;background:rgba(120,90,60,.55);border:2px solid var(--line)}
.msg.sys{align-self:center;font-size:12px;color:var(--cream-dim);background:none;border:1px dashed var(--line);padding:6px 10px;text-align:center}
.sb-foot{border-top:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.sb-foot textarea{
  width:100%;height:64px;resize:none;background:rgba(20,14,11,.6);
  border:2px solid var(--line);color:var(--cream);padding:9px 10px;
  font-size:13px;font-family:inherit;outline:none;line-height:1.5;
}
.sb-foot textarea:focus{border-color:var(--amber-dim)}
.sb-foot .row{display:flex;gap:8px;align-items:center}
.sb-foot .row .tip{flex:1;font-size:11px;color:var(--cream-dim)}
.btn{
  padding:8px 16px;background:var(--amber-dim);border:2px solid var(--amber);
  color:#2a1c10;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  letter-spacing:1px;transition:all .15s;box-shadow:3px 3px 0 rgba(0,0,0,.4);
}
.btn:hover{background:var(--amber)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 侧栏把手 */
.sb-handle{
  position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:45;
  width:52px;padding:16px 0;background:var(--panel);border:2px solid var(--line);
  border-right:none;cursor:pointer;writing-mode:vertical-rl;
  font-size:13px;letter-spacing:5px;color:var(--amber);text-align:center;
  transition:all .18s;box-shadow:-4px 4px 0 rgba(0,0,0,.4);
}
.sb-handle:hover{background:#5a3f2e;color:#fff}
.sidebar.open ~ .sb-handle{opacity:0;pointer-events:none}

/* ============ 疑问库 ============ */
.vault{
  position:fixed;right:0;top:0;bottom:0;width:470px;z-index:70;
  background:var(--panel-2);border-left:3px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 24px rgba(0,0,0,.5);
}
.vault.open{transform:translateX(0)}
.vault-hd{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;border-bottom:2px solid var(--line);
}
.vault-hd .title{font-size:14px;letter-spacing:2px;color:var(--amber)}
.vault-hd .vault-cnt{flex:1;font-size:11px;color:var(--cream-dim)}
.vault-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn.sm{padding:5px 12px;font-size:12px;box-shadow:none}
.vault-item{border:2px solid var(--line);background:rgba(20,14,11,.45);padding:10px 12px}
.vault-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vault-item .subj{
  font-size:11px;padding:1px 6px;background:rgba(255,200,97,.15);
  border:1px solid var(--line-2);color:var(--amber);
}
.vault-item .st{font-size:11px;color:var(--cream-dim);margin-left:auto}
.vault-item .pt{font-size:13px;color:var(--cream);line-height:1.5;margin-bottom:4px}
.vault-item .q{font-size:12px;color:var(--cream-dim);line-height:1.5}
.vault-item .bar{height:6px;background:rgba(0,0,0,.4);margin-top:8px;border:1px solid var(--line)}
.vault-item .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.vault-empty{padding:34px 16px;text-align:center;font-size:12.5px;color:var(--cream-dim);line-height:2}
.vault-empty b{color:var(--amber);font-weight:600}

/* 复习卡片 */
.review-card{border:2px solid var(--amber-dim);background:rgba(255,200,97,.07);padding:14px}
.review-card .lbl{font-size:11px;color:var(--cream-dim);letter-spacing:2px;margin-bottom:8px}
.review-card .pt{font-size:15px;color:var(--amber);line-height:1.6;margin-bottom:10px}
.review-card .hintline{font-size:12px;color:var(--cream-dim);line-height:1.6}
.review-card .progress{font-size:11px;color:var(--cream-dim);margin-top:10px}
.review-card textarea{
  width:100%;height:80px;resize:none;margin-top:12px;
  background:rgba(20,14,11,.6);border:2px solid var(--line);
  color:var(--cream);padding:9px 10px;font-size:13px;
  font-family:inherit;outline:none;line-height:1.5;
}
.review-card textarea:focus{border-color:var(--amber-dim)}
.review-card .acts{display:flex;gap:8px;margin-top:10px}
.review-result{margin-top:10px;padding:10px;border:2px solid var(--line);font-size:13px;line-height:1.6}
.review-result.ok{border-color:var(--ok);background:rgba(143,191,106,.12)}
.review-result.no{border-color:#e07a5f;background:rgba(224,122,95,.12)}
/* 判不出来时显式跳过：中性色，不写成「错了」 */
.review-result.skip{border-style:dashed;border-color:var(--line-2);background:rgba(0,0,0,.25);color:var(--cream-dim)}

/* 误解档案：重要度 / 置顶 / 卡住的地方 / 跟进建议 */
.vault-item.pinned{border-color:var(--amber);background:rgba(255,200,97,.10)}
.vault-item .imp{font-size:11px;padding:1px 6px;border:1px solid var(--line-2);color:var(--cream-dim)}
.vault-item .imp-high{color:#e8b48a;border-color:#e07a5f;background:rgba(224,122,95,.14)}
.vault-item .imp-medium{color:var(--amber);border-color:var(--line-2);background:rgba(255,200,97,.12)}
.vault-item .imp-low{color:var(--cream-dim)}
.vault-item .pin{font-size:11px;color:var(--amber)}
.vault-item .mis{font-size:12px;color:#e8b48a;line-height:1.55;margin-top:6px}
.vault-item .fu{font-size:12px;color:var(--ok);line-height:1.55;margin-top:4px}
/* 「差一步怎么过」：讲的是改进路径，配色用「可以走通」的绿，不用报错的红 */
.next-step{
  margin-top:8px;padding:10px 12px;font-size:13px;line-height:1.65;
  border:2px solid var(--ok);border-left:4px solid var(--ok);
  background:rgba(143,191,106,.10);color:var(--cream);
}
.next-step b{color:var(--ok)}
.mis-note,.fu-note{margin-top:8px;font-size:12px;line-height:1.6;color:#e8b48a}
.fu-note{color:var(--amber-dim)}

.topbar .icon-btn{position:relative}
.badge{
  position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;line-height:17px;
  padding:0 4px;background:#e07a5f;border:1px solid rgba(255,255,255,.25);color:#fff;
  font-size:10px;border-radius:10px;text-align:center;white-space:nowrap;
}

/* ============ 设置弹窗 ============ */
.mask{
  position:fixed;inset:0;background:rgba(10,6,4,.72);z-index:80;
  display:none;align-items:center;justify-content:center;
}
.mask.open{display:flex}
.modal{
  width:460px;max-width:92vw;background:var(--panel-2);
  border:3px solid var(--line);box-shadow:8px 8px 0 rgba(0,0,0,.55);
}
.modal-hd{
  padding:12px 16px;border-bottom:2px solid var(--line);
  font-size:14px;letter-spacing:2px;color:var(--amber);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--cream-dim);letter-spacing:1px}
.field input{
  background:rgba(20,14,11,.65);border:2px solid var(--line);
  color:var(--cream);padding:9px 10px;font-size:13px;
  font-family:inherit;outline:none;
}
.field input:focus{border-color:var(--amber-dim)}
.field .hint{font-size:11px;color:#8a7562;line-height:1.5}
.modal-ft{
  padding:12px 16px;border-top:2px solid var(--line);
  display:flex;justify-content:flex-end;gap:10px;
}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{background:rgba(255,200,97,.1);color:var(--amber);border-color:var(--amber)}

/* 番茄钟小卡片 */
.pomo{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(140%);
  z-index:60;background:var(--panel-2);border:3px solid var(--line);
  padding:14px 22px;display:flex;align-items:center;gap:16px;
  box-shadow:6px 6px 0 rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.34,1.4,.64,1);
}
.pomo.open{transform:translateX(-50%) translateY(0)}
.pomo .time{font-size:30px;letter-spacing:3px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:112px;text-align:center}
.pomo .lbl{font-size:11px;color:var(--cream-dim);letter-spacing:2px;margin-top:2px;text-align:center}

/* 提示条 */
.toast{
  position:fixed;left:50%;top:24px;z-index:90;
  background:var(--panel-2);border:2px solid var(--amber);
  color:var(--amber);padding:9px 18px;font-size:13px;letter-spacing:1px;
  box-shadow:4px 4px 0 rgba(0,0,0,.5);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translate(-50%,-16px);
  transition:transform .3s,opacity .3s,visibility .3s;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.25)}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:padding-box}
</style>
</head>
<body>

<!-- ============ 场景 ============ -->
<div class="scene" id="scene"></div>

<!-- 人物热区 -->
<div class="hotspot" id="hotspot">
  <div class="hint">点 我</div>
</div>

<!-- 辐射菜单 -->
<div class="radial" id="radial">
  <div class="radial-item ri-1" data-act="pomo"><span class="ic">🍅</span><span>番茄钟</span></div>
  <div class="radial-item ri-2" data-act="ask"><span class="ic">💬</span><span>问问题</span></div>
  <div class="radial-item ri-3" data-act="review"><span class="ic">🎯</span><span>考考我</span></div>
  <div class="radial-item ri-4" data-act="close"><span class="ic">✕</span><span>关闭</span></div>
  <div class="radial-item ri-5" data-act="vault"><span class="ic">📚</span><span>疑问库</span></div>
  <div class="radial-item ri-6" data-act="setting"><span class="ic">⚙️</span><span>设置</span></div>
</div>

<!-- ============ 右上角工具栏 ============ -->
<div class="topbar">
  <button class="icon-btn" id="tbVault" title="疑问库">📚<span class="badge" id="vaultBadge"></span></button>
  <button class="icon-btn" id="tbPomo" title="番茄钟">🍅</button>
  <button class="icon-btn" id="tbSetting" title="接口设置">⚙</button>
</div>

<!-- ============ To-Do ============ -->
<aside class="todo">
  <div class="todo-hd"><span>TO-DO LIST</span><span class="cnt" id="todoCnt"></span></div>
  <div class="todo-body" id="todoBody"></div>
  <div class="todo-add">
    <input id="todoInput" placeholder="添加一件事，回车确认…" maxlength="60">
    <button id="todoAdd" title="添加">＋</button>
  </div>
</aside>

<!-- ============ 侧栏把手 ============ -->
<div class="sb-handle" id="sbHandle">临时对话</div>

<!-- ============ 侧栏 ============ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-hd">
    <span class="title">临时对话</span>
    <button class="icon-btn" id="sbSetting" title="API 设置">⚙</button>
    <button class="icon-btn" id="sbClear" title="清空对话">🗑</button>
    <button class="icon-btn" id="sbClose" title="收起">✕</button>
  </div>
  <div class="sb-body" id="sbBody"></div>
  <div class="sb-foot">
    <textarea id="sbInput" placeholder="有什么不懂的，随手问我…（Ctrl+Enter 发送）"></textarea>
    <div class="row">
      <span class="tip" id="sbTip">未配置 API</span>
      <button class="btn" id="sbSend">发送</button>
    </div>

<script>
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ================= To-Do ================= */
let todos = LS.get('study_todos', [
  { id: 1, text: '背 20 个生物名词', done: false },
  { id: 2, text: '订正昨天的错题', done: false },
  { id: 3, text: '预习免疫调节', done: true }
]);

function renderTodos() {
  const body = $('todoBody');
  if (!todos.length) {
    body.innerHTML = '<div class="todo-empty">还没有待办，加一件吧</div>';
  } else {
    body.innerHTML = todos.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''}" data-id="${t.id}">
        <div class="box" data-act="toggle"></div>
        <div class="txt">${esc(t.text)}</div>
        <div class="del" data-act="del">✕</div>
      </div>`).join('');
  }
  const left = todos.filter(t => !t.done).length;
  $('todoCnt').textContent = todos.length ? `${left}/${todos.length}` : '';
  LS.set('study_todos', todos);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addTodo() {
  const inp = $('todoInput');
  const v = inp.value.trim();
  if (!v) return;
  todos.push({ id: Date.now(), text: v, done: false });
  inp.value = '';
  renderTodos();
}

$('todoAdd').onclick = addTodo;
$('todoInput').onkeydown = e => { if (e.key === 'Enter') addTodo(); };
$('todoBody').onclick = e => {
  const item = e.target.closest('.todo-item');
  if (!item) return;
  const id = Number(item.dataset.id);
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const act = e.target.dataset.act;
  if (act === 'toggle') { t.done = !t.done; if (t.done) toast('完成一件事，真棒 👏'); }
  else if (act === 'del') { todos = todos.filter(x => x.id !== id); }
  else return;
  renderTodos();
};
renderTodos();

/* ================= 辐射菜单 ================= */
const scene = $('scene'), hotspot = $('hotspot'), radial = $('radial');

function openRadial() {
  radial.classList.add('open');
  hotspot.classList.add('hidden');
  scene.classList.add('dim');
}
function closeRadial() {
  radial.classList.remove('open');
  hotspot.classList.remove('hidden');
  scene.classList.remove('dim');
}
hotspot.onclick = openRadial;
radial.onclick = e => {
  const item = e.target.closest('.radial-item');
  if (!item) return;
  const act = item.dataset.act;
  closeRadial();
  if (act === 'close') return;
  if (act === 'ask') { openSidebar(); return; }
  if (act === 'setting') { openSettings(); return; }
  if (act === 'pomo') { openPomo(); return; }
  if (act === 'review') { openVault(); startReview(); return; }
  if (act === 'vault') { openVault(); return; }
};
document.addEventListener('click', e => {
  if (radial.classList.contains('open') && !radial.contains(e.target) && !hotspot.contains(e.target)) closeRadial();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeRadial(); closeSettings(); } });

/* ================= 侧栏 ================= */
const sidebar = $('sidebar'), sbBody = $('sbBody');

function openSidebar(prefill) {
  sidebar.classList.add('open');
  if (prefill) { $('sbInput').value = prefill; $('sbInput').focus(); }
  setTimeout(() => $('sbInput').focus(), 320);
}
$('sbHandle').onclick = () => openSidebar();
$('sbClose').onclick = () => sidebar.classList.remove('open');
$('sbClear').onclick = () => {
  history.length = 0;
  renderMsgs();
  toast('对话已清空（历史已重置）');
};
$('sbSetting').onclick = openSettings;

let history = LS.get('study_history', []);
const DEFAULT_PROMPT = '你是一个温柔、耐心的 AI 学习伙伴，陪伴高中生学习。回答要口语化、简洁，多用鼓励的语气。解释知识点时先说人话，再举一个小例子。不要长篇大论。回答的正文最后一行，固定用「下一步：…」给一个可执行的建议动作（例如"下一步：要不要我出个小问题考考你"、"下一步：接着看你的待办清单"）。同一件事不要重复追问——如果上一轮已经提过而学生没回应，就不要再提，自然结束即可。';

/* ================= 疑问库（产品核心机制） =================
   学生随口问的知识疑问 → AI 回答后自动打标签入库
        → 到期后 AI 反过来考他 → 答对拉长间隔，答错重置
   数据全部存在本地浏览器，不上传服务器。
   --------------------------------------------------------- */
/* 标记规则：问答双方都靠这段结构化数据沟通，字段认不出就不写库，不猜。
   importance 判据、字段结构借鉴 Study-Mate (MIT © 2026 Cattofu)。 */
const TAG_RULE = `

【标记规则】每次回答结束后，另起一行输出一个标记块（必须是合法 JSON，不要用代码块包裹）：
<tag>{"knowledge":true,"subject":"生物","point":"免疫防御的三道防线","importance":"high"}</tag>
- 学生问的是学科知识 → knowledge 为 true，并填写 subject（学科）与 point（具体知识点）
- 只是闲聊、寒暄、问功能怎么用 → knowledge 为 false，subject 与 point 留空字符串，importance 记 "low"
- importance 判据：影响后续学习的（前置知识错）记 "high"；一次性小疑问记 "low"；拿不准记 "medium"
- 四个字段都要写，任何字段都不许写 null
- 标记块必须是整条回复的最后一行；正文的收尾（比如「下一步：…」）写在标记块之前。不要省略标记块。`;

const REVIEW_INTERVALS = [1, 3, 7, 15, 30];   // 天：间隔重复的复习间隔
const DAY = 24 * 60 * 60 * 1000;

/* ?mock=1 注入示例数据 —— 录演示视频时用，省得真的问一堆问题 */
if (new URLSearchParams(location.search).get('mock') === '1'
    && !LS.get('study_vault', []).length) {
  const now = Date.now();
  LS.set('study_vault', [
    { id: 'm2', content: '光反应到底在哪进行', subject: '生物', point: '光反应的场所与产物',
      answer: '光反应在类囊体薄膜上进行，产物是 ATP 和 NADPH，同时释放氧气。',
      status: 'new', mastery: 0, reviewCount: 0, askCount: 1,
      importance: 'medium', misunderstanding: '', followUp: '',
      nextReviewAt: now - 60000, createdAt: now - 2 * DAY, reviews: [] },
    { id: 'm3', content: '内环境稳态是什么意思', subject: '生物', point: '内环境稳态的概念',
      answer: '正常机体通过调节作用，使各个器官、系统协调活动，共同维持内环境的相对稳定状态。',
      status: 'mastered', mastery: 100, reviewCount: 4, askCount: 1,
      importance: 'low', misunderstanding: '', followUp: '',
      nextReviewAt: now + 20 * DAY, createdAt: now - 9 * DAY, reviews: [] },
    // 故意放在数组最后：askCount 到 3 应该被置顶，渲染时排在第一条
    { id: 'm1', content: '什么是免疫防御', subject: '生物', point: '免疫防御的三道防线',
      answer: '人体有三道防线。第一道是皮肤和黏膜，阻挡病原体；第二道是体液中的杀菌物质和吞噬细胞；第三道是特异性免疫，包括体液免疫和细胞免疫。',
      status: 'learning', mastery: 34, reviewCount: 1, askCount: 3,
      importance: 'high',
      misunderstanding: '把第二道防线（杀菌物质和吞噬细胞）说成了特异性免疫，三道防线的层次没分清。',
      followUp: '下次复习专门问一次第二道防线的作用，看能不能不看笔记讲出来。',
      nextReviewAt: now - 60000, createdAt: now - 3 * DAY, reviews: [] }
  ]);
}

let vault = LS.get('study_vault', []);
const saveVault = () => LS.set('study_vault', vault);

/* 归一化比较键：学科 + 知识点，去空格、忽略大小写 —— 判断「是不是同一条疑问」 */
const normKey = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
/* 模型给的字段可能是 null / 数字 / 对象，统一转成安全字符串（旧数据没有字段也不会崩） */
const asText = v => (v === null || v === undefined || typeof v === 'object') ? '' : String(v).trim();
const IMPORTANCE = ['low', 'medium', 'high'];
/* importance 兜底：旧数据没这个字段、模型乱填 → 都按 medium */
const normImportance = v => {
  const s = asText(v).toLowerCase();
  return IMPORTANCE.indexOf(s) >= 0 ? s : 'medium';
};
/* 问到第 3 次就该换个讲法了：列表里置顶、重要度记 high */
const ASK_PIN = 3;
const isPinned = q => (Number(q && q.askCount) || 0) >= ASK_PIN;

/* 从 AI 回复中抽出标记块，并把标记块从正文里剔除。
   解析失败不猜也不静默：tag 为 null，同时用 tagBroken 说明「有标记块但认不出来」 */
function extractTag(text) {
  const src = String(text);
  const m = src.match(/<tag>([\s\S]*?)<\/tag>/i);
  if (!m) return { clean: src, tag: null, tagBroken: false };
  let tag = null;
  try { tag = JSON.parse(m[1].trim()); } catch (e) { tag = null; }
  if (!tag || typeof tag !== 'object' || Array.isArray(tag)) tag = null;
  return { clean: src.replace(m[0], '').trim(), tag, tagBroken: !tag };
}

/* 入库。同一知识点只留一条（按 subject+point 归一化后比较），重复问到就刷新并重置复习进度。
   第 3 次问到同一条：importance 提到 high + 列表置顶 + 回答末尾追加「换个讲法」的提示。
   返回 { q, repeat }：repeat = 这是第几次问到（计数纯前端做，不需要后端/向量检索）。 */
function addQuestion({ content, answer, tag }) {
  if (!tag || tag.knowledge !== true) return null;
  const point = asText(tag.point);
  const subject = asText(tag.subject);
  if (!point) return null;

  const importance = normImportance(tag.importance);
  const key = normKey(subject) + '|' + normKey(point);
  const exist = vault.find(q => normKey(q.subject) + '|' + normKey(q.point) === key);

  if (exist) {
    // 旧条目没存过 askCount：它本身算被问过 1 次，从这里往上加
    exist.askCount = (Number(exist.askCount) || 1) + 1;
    exist.content = content;
    exist.answer = answer;
    // 重要度只升不降：判过 high 的别被后来的 low/medium 冲掉；到第 3 次强制 high
    exist.importance = (exist.importance === 'high' || importance === 'high' || exist.askCount >= ASK_PIN)
      ? 'high' : importance;
    exist.status = 'new';
    exist.mastery = 0;
    exist.reviewCount = 0;
    exist.nextReviewAt = Date.now() + REVIEW_INTERVALS[0] * DAY;
    exist.updatedAt = Date.now();
    saveVault();
    return { q: exist, repeat: exist.askCount };
  }

  const q = {
    id: 'q' + Date.now() + Math.random().toString(36).slice(2, 6),
    content, answer, subject, point,
    status: 'new',                                  // new / learning / mastered
    mastery: 0,                                     // 掌握度 0-100
    reviewCount: 0,
    askCount: 1,                                    // 被问到过几次（用来判定「问第 3 次」）
    importance,                                     // low / medium / high
    misunderstanding: '',                           // 学生具体错在哪（复习判定时回填）
    followUp: '',                                   // 建议的跟进动作（复习判定时回填）
    nextReviewAt: Date.now() + REVIEW_INTERVALS[0] * DAY,
    createdAt: Date.now(),
    reviews: []
  };
  vault.unshift(q);
  saveVault();
  return { q, repeat: 1 };
}

const dueQuestions = () => vault.filter(q => q.status !== 'mastered' && q.nextReviewAt <= Date.now());

function renderVaultBadge() {
  const el = $('vaultBadge');
  if (!el) return;
  const n = vault.length;
  const d = dueQuestions().length;
  el.textContent = n ? (d ? d + ' 待复习' : n + ' 条') : '';
  el.style.display = n ? '' : 'none';
}

function renderMsgs() {
  if (!history.length) {
    sbBody.innerHTML = '<div class="msg sys">随便问我点什么吧。<br>比如「什么是免疫防御」</div>';
    return;
  }
  sbBody.innerHTML = history.map(m => `<div class="msg ${m.role === 'user' ? 'me' : 'ai'}">${esc(m.content).replace(/\n/g, '<br>')}</div>`).join('');
  sbBody.scrollTop = sbBody.scrollHeight;
}
renderMsgs();

const DEFAULT_URL = 'https://api.deepseek.com/v1/chat/completions';

/* 智能补全接口地址：
   填官方文档的 BASE URL（如 https://api.deepseek.com）或完整端点都能用。
   SDK 会自动拼 /chat/completions，但手写的 fetch 不会——所以这里替它补上。 */
function normalizeUrl(raw) {
  let u = String(raw || '').trim().replace(/\s+/g, '');
  if (!u) return DEFAULT_URL;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  u = u.replace(/\/+$/, '');
  if (/\/chat\/completions$/i.test(u)) return u;   // 已经是完整端点
  return u + '/chat/completions';                  // 自动补上路径
}

function cfg() {
  return {
    url: normalizeUrl(LS.get('study_api_url', DEFAULT_URL)),
    key: LS.get('study_api_key', ''),
    model: LS.get('study_api_model', 'deepseek-chat'),
    prompt: LS.get('study_api_prompt', DEFAULT_PROMPT),
    configured: !!LS.get('study_api_key', '')
  };
}

async function send() {
  const inp = $('sbInput');
  const text = inp.value.trim();
  if (!text) return;
  const c = cfg();
  if (!c.configured) { toast('请先在 ⚙ 设置里填 API Key'); openSettings(); return; }

  history.push({ role: 'user', content: text });
  inp.value = '';
  renderMsgs();
  LS.set('study_history', history);

  const btn = $('sbSend');
  btn.disabled = true;
  btn.textContent = '思考中…';
  sbBody.innerHTML += '<div class="msg ai" id="pending">…</div>';
  sbBody.scrollTop = sbBody.scrollHeight;

  try {
    const res = await fetch(c.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({
        model: c.model,
        messages: [{ role: 'system', content: c.prompt + TAG_RULE }, ...history.slice(-16)]
      })
    });
    if (!res.ok) {
      const body = (await res.text()).slice(0, 200);
      const hints = {
        400: '请求格式有问题', 401: 'API Key 无效或未授权', 402: '余额不足',
        403: '没有权限访问该模型', 404: '接口地址不对（已自动补全，请检查地址拼写）',
        422: '参数不合法', 429: '请求太频繁，稍后再试',
        500: '服务商内部错误', 502: '网关错误', 503: '服务暂时不可用'
      };
      throw new Error(`HTTP ${res.status}　${hints[res.status] || ''}\n${body}\n\n实际请求地址：${c.url}`);
    }
    const data = await res.json();
    const raw = data?.choices?.[0]?.message?.content ?? '(没有拿到回复)';
    const { clean: reply, tag, tagBroken } = extractTag(raw);

    // 自动沉淀：抽到知识标签就写进疑问库
    const saved = addQuestion({ content: text, answer: reply, tag });
    let out = reply;
    if (saved) {
      renderVaultBadge();
      toast('已记进疑问库 · ' + (saved.q.subject ? saved.q.subject + ' · ' : '') + saved.q.point);
      // 同一条问到第 3 次：换个讲法，而不是把同一句话再说一遍
      if (saved.repeat >= ASK_PIN) {
        out = reply + `\n\n这个点你已经问过 ${saved.repeat} 次了，要不要我换个讲法专门讲一遍？`;
      }
    } else if (tagBroken) {
      // 认不出就不写库（保持），但要说一声，别让用户以为记下了
      toast('这次没能识别出知识点，没有记录');
    }

    history.push({ role: 'assistant', content: out });
    LS.set('study_history', history);
    renderMsgs();
  } catch (err) {
    renderMsgs();
    sbBody.innerHTML += `<div class="msg sys">请求失败：${esc(err.message)}</div>`;
    sbBody.scrollTop = sbBody.scrollHeight;
  } finally {
    btn.disabled = false;
    btn.textContent = '发送';
  }
}
$('sbSend').onclick = send;
$('sbInput').onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
};

/* ================= 设置 ================= */
const mask = $('mask');
function openSettings() {
  const c = cfg();
  $('cfgUrl').value = c.url;
  $('cfgKey').value = c.key;
  $('cfgModel').value = c.model;
  $('cfgPrompt').value = c.prompt;
  mask.classList.add('open');
}
function closeSettings() { mask.classList.remove('open'); }
$('setClose').onclick = closeSettings;
$('setCancel').onclick = closeSettings;
$('setSave').onclick = () => {
  LS.set('study_api_url', $('cfgUrl').value.trim() || 'https://api.deepseek.com/v1/chat/completions');
  LS.set('study_api_key', $('cfgKey').value.trim());
  LS.set('study_api_model', $('cfgModel').value.trim() || 'deepseek-chat');
  LS.set('study_api_prompt', $('cfgPrompt').value.trim() || DEFAULT_PROMPT);

};
mask.onclick = e => { if (e.target === mask) closeSettings(); };

function updateTip() {
  const c = cfg();
  $('sbTip').textContent = c.configured ? '已连接 · ' + c.model : '未配置 API（点右上角 ⚙）';
}
updateTip();

/* ================= 番茄钟 ================= */
const pomo = $('pomo');
let pomoLeft = 25 * 60, pomoTimer = null, pomoRunning = false;

function openPomo() {
  pomo.classList.add('open');
  toast('开始专注，我陪着你 🍅');
}
$('tbPomo').onclick = () => { closeRadial(); openPomo(); };
$('tbSetting').onclick = () => openSettings();
$('pomoClose').onclick = () => { pomo.classList.remove('open'); stopPomo(); };
$('pomoToggle').onclick = () => pomoRunning ? stopPomo() : startPomo();

function startPomo() {
  pomoRunning = true;
  $('pomoToggle').textContent = '暂停';
  $('pomoLbl').textContent = '专注中';
  pomoTimer = setInterval(() => {
    pomoLeft--;
    paintPomo();
    if (pomoLeft <= 0) {
      stopPomo();
      toast('番茄钟完成！休息一下吧 ✅');
      pomoLeft = 25 * 60;
      paintPomo();
    }
  }, 1000);
}
function stopPomo() {
  pomoRunning = false;
  clearInterval(pomoTimer);
  $('pomoToggle').textContent = '继续';
  $('pomoLbl').textContent = '已暂停';
}
function paintPomo() {
  const m = String(Math.floor(pomoLeft / 60)).padStart(2, '0');
  const s = String(pomoLeft % 60).padStart(2, '0');
  $('pomoTime').textContent = m + ':' + s;
}
paintPomo();

/* ================= 疑问库：列表与复习 ================= */
const vaultEl = $('vault'), vaultBody = $('vaultBody');
let reviewQueue = [], reviewIdx = 0;

function openVault() {
  reviewQueue = [];
  vaultEl.classList.add('open');
  renderVault();
}
function closeVault() { vaultEl.classList.remove('open'); }

function renderVault() {
  $('vaultCnt').textContent = vault.length
    ? `共 ${vault.length} 条 · ${dueQuestions().length} 条待复习` : '';

  if (!vault.length) {
    vaultBody.innerHTML = `<div class="vault-empty">
      疑问库还是空的。<br><br>
      去右边「临时对话」问一个问题吧，<br>
      比如 <b>什么是免疫防御</b><br>
      —— 它答完会自动记到这里，<br>
      以后还会回来考你。
    </div>`;
    return;
  }

  // 问到第 3 次的置顶（sort 稳定，其余保持原有顺序）；不引入后端/向量检索
  const ordered = vault.slice().sort((a, b) => (isPinned(b) ? 1 : 0) - (isPinned(a) ? 1 : 0));

  vaultBody.innerHTML = ordered.map(q => {
    const st = q.status === 'mastered' ? '已掌握'
             : (q.nextReviewAt <= Date.now() ? '该复习了' : '复习中');
    const imp = normImportance(q.importance);
    const impLabel = { high: '重要', medium: '一般', low: '小疑问' }[imp];
    const mis = asText(q.misunderstanding);
    const fu = asText(q.followUp);
    const pct = Math.max(0, Math.min(100, Number(q.mastery) || 0));
    return `<div class="vault-item${isPinned(q) ? ' pinned' : ''}">
      <div class="row1">
        <span class="subj">${esc(q.subject || '未分类')}</span>
        <span class="imp imp-${imp}">${impLabel}</span>
        ${isPinned(q) ? `<span class="pin">已问 ${Number(q.askCount) || 0} 次</span>` : ''}
        <span class="st">${st}</span>
      </div>
      <div class="pt">${esc(q.point || '')}</div>
      <div class="q">你当时问：${esc(q.content || '')}</div>
      ${mis ? `<div class="mis">⚠ 卡住的地方：${esc(mis)}</div>` : ''}
      ${fu ? `<div class="fu">→ 跟进建议：${esc(fu)}</div>` : ''}
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('');
}

function startReview() {
  const due = dueQuestions();
  const pool = due.length ? due : vault.filter(q => q.status !== 'mastered');
  if (!pool.length) {
    toast(vault.length ? '这一批都掌握啦，厉害 🎉' : '疑问库还是空的');
    return;
  }
  vaultEl.classList.add('open');
  reviewQueue = pool.slice();
  reviewIdx = 0;
  showReviewCard();
}

function showReviewCard() {
  if (reviewIdx >= reviewQueue.length) {
    reviewQueue = [];
    renderVault();
    renderVaultBadge();
    toast('这一轮复习完成 👏');
    return;
  }
  const q = reviewQueue[reviewIdx];
  vaultBody.innerHTML = `<div class="review-card">
    <div class="lbl">第 ${reviewIdx + 1} / ${reviewQueue.length} 题 · 你以前问过的</div>
    <div class="pt">${esc(q.point)}</div>
    <div class="hintline">不要背定义——用你自己的话讲讲这个知识点，最好举一个你自己的例子。</div>
    <textarea id="revInput" placeholder="我理解它是这样：…"></textarea>
    <div class="acts">
      <button class="btn" id="revSubmit">提交</button>
      <button class="btn ghost" id="revSkip">跳过</button>
      <button class="btn ghost" id="revExit">结束复习</button>
    </div>
  </div>`;
  $('revSubmit').onclick = submitReview;
  $('revSkip').onclick = () => { reviewIdx++; showReviewCard(); };
  $('revExit').onclick = () => { reviewQueue = []; renderVault(); };
  $('revInput').focus();
}

/* 判定规则：把「AI 说对错」变成「有判据的评分」。
   三档口径、每条结论必须指向具体证据、禁机械复述得分 —— 借鉴 Study-Mate
   layered-practice / evidence-check（MIT © 2026 Cattofu）。 */
const JUDGE_RULE = `你是一个严格但友善的阅卷老师，按下面的评分规则判定学生的复述。

【三档口径】
- full：通过。判分要点都讲清了，而且有自己的解释。
- partial：部分通过。missing 里必须列出「缺哪一条判分要点」，并写清「差一步怎么过」。
- wrong：不通过。必须给出原因，并在 missing 里写清「差一步怎么过」。

【每条结论必须指向具体证据】
- 判 full 时，必须能在学生原话里指出支撑这个判断的具体那一句。
- 指不出具体证据的，一律判 partial 或 wrong，不许判 full。
- 不得因为「学生说懂了」「语气自信」「字数多」「态度好」就判过——说懂了不是证据。

【禁止机械复述得分】
- 只是背定义、背原句、复述参考回答，而没有自己的解释，不能判 full。
- 这种情况判 partial，并在 missing 里写明：「你只是复述了原句，试试用自己的话解释为什么」。

【字段怎么写】
- missing：缺哪一条判分要点 + 差一步怎么过（判 full 时留空字符串）。
- misunderstanding：学生具体在哪里理解错了；没有明显错误就留空字符串。
- followUp：建议的跟进动作，一句话。

【输出格式】必须输出一行合法 JSON，用 <result> 包裹，不要用代码块，不要输出别的格式：
<result>{"level":"full|partial|wrong","comment":"给学生的点评（20字内，友好）","missing":"缺哪条要点 + 差一步怎么过","misunderstanding":"学生具体错在哪","followUp":"建议的跟进动作"}</result>`;

async function submitReview() {
  const ans = $('revInput').value.trim();
  if (!ans) { toast('先写点东西吧'); return; }
  const q = reviewQueue[reviewIdx];
  const c = cfg();

  const btn = $('revSubmit');
  btn.disabled = true;
  btn.textContent = '判定中…';

  /* 状态以结构化数据为准，模型说的话不算数：判不出来就不判，而不是猜一个 partial。
     level 保持 null 时 → 不动掌握度、不改下次复习时间。 */
  let level = null, comment = '', missing = '', misunderstanding = '', followUp = '', skipWhy = '';

  if (!c.configured) {
    skipWhy = '还没配置 API，这次没法判定';
  } else {
    let raw = '';
    try {
      const res = await fetch(c.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
        body: JSON.stringify({
          model: c.model,
          messages: [
            { role: 'system', content: JUDGE_RULE },
            { role: 'user', content:
              `知识点：${q.point}\n参考回答：${q.answer}\n\n学生的复述：${ans}\n\n` +
              `请按评分规则判定，并输出一行 <result>{...}</result>。` }
          ]
        })
      });
      if (!res.ok) {
        skipWhy = '判定请求失败（HTTP ' + res.status + '）';
      } else {
        const data = await res.json();
        raw = data?.choices?.[0]?.message?.content || '';
      }
    } catch (e) {
      skipWhy = '判定请求失败';
    }

    if (!skipWhy) {
      const m = raw.match(/<result>([\s\S]*?)<\/result>/i);
      let r = null;
      try { r = m ? JSON.parse(m[1].trim()) : null; } catch (e) { r = null; }
      const lv = r ? asText(r.level).toLowerCase() : '';
      if (lv === 'full' || lv === 'partial' || lv === 'wrong') {
        level = lv;
        comment = asText(r.comment);
        missing = asText(r.missing);
        misunderstanding = asText(r.misunderstanding);
        followUp = asText(r.followUp);
        if (level === 'full') missing = '';            // 通过了就不显示「差一步」
      } else {
        skipWhy = '这次没能解析出判定结果';             // 不按 partial 处理
      }
    }
  }

  if (!level) { renderReviewResult(q, null, '', '', '', '', skipWhy); return; }

  applyReview(q, level, ans, { comment, missing, misunderstanding, followUp });
  renderReviewResult(q, level, comment, missing, misunderstanding, followUp, '');
}

/* 判定结果卡片。partial / wrong 必须显示「差一步怎么过」，并且要看得出来
   这是改进路径而不是「你错了」；完整通过时不显示。 */
function renderReviewResult(q, level, comment, missing, misunderstanding, followUp, skipWhy) {
  const isFull = level === 'full';
  const label = level === null ? '⏸ 这次没判定'
              : isFull ? '✅ 答得不错'
              : level === 'partial' ? '🟡 还差一点' : '❌ 这里没记住';
  const cls = level === null ? 'skip' : (isFull ? 'ok' : 'no');

  vaultBody.innerHTML = `<div class="review-card">
    <div class="lbl">判定结果</div>
    <div class="pt">${esc(q.point || '')}</div>
    <div class="review-result ${cls}">${label}${
      level === null
        ? `<br>${esc(skipWhy || '这次没能解析出判定结果')}，已跳过（不影响掌握度）`
        : (comment ? '<br>' + esc(comment) : '')
    }</div>
    ${missing ? `<div class="next-step"><b>差一步怎么过：</b>${esc(missing)}</div>` : ''}
    ${misunderstanding ? `<div class="mis-note">⚠ 卡住的地方：${esc(misunderstanding)}</div>` : ''}
    ${followUp ? `<div class="fu-note">→ 跟进建议：${esc(followUp)}</div>` : ''}
    <div class="acts"><button class="btn" id="revNext">下一题</button></div>
  </div>`;
  $('revNext').onclick = () => { reviewIdx++; showReviewCard(); };
  renderVaultBadge();
}

/* 间隔重复：答对拉长间隔，答错重置。
   只记可观察的证据：判不出来（level 不是三档）时直接返回，什么状态都不动。 */
function applyReview(q, level, ans, extra) {
  if (level !== 'full' && level !== 'partial' && level !== 'wrong') return;
  const ex = extra || {};
  q.mastery = Number(q.mastery) || 0;                // 兜底：旧数据可能没有这个字段
  q.reviewCount = (q.reviewCount || 0) + 1;
  q.reviews = q.reviews || [];
  // 旧结论留在 reviews[] 里，不覆盖删除
  q.reviews.push({ at: Date.now(), level, answer: ans,
    comment: ex.comment || '', missing: ex.missing || '',
    misunderstanding: ex.misunderstanding || '', followUp: ex.followUp || '' });

  // 误解回填：只覆盖有内容的判定；讲明白了就把当前误解清空（历史仍在 reviews[]）
  if (ex.misunderstanding) q.misunderstanding = ex.misunderstanding;
  else if (level === 'full') q.misunderstanding = '';
  if (ex.followUp) q.followUp = ex.followUp;

  if (level === 'full') {
    q.mastery = Math.min(100, q.mastery + 34);
    const step = Math.min(q.reviewCount, REVIEW_INTERVALS.length - 1);
    q.nextReviewAt = Date.now() + REVIEW_INTERVALS[step] * DAY;
    q.status = q.mastery >= 100 ? 'mastered' : 'learning';
  } else if (level === 'partial') {
    q.mastery = Math.min(95, q.mastery + 15);
    q.nextReviewAt = Date.now() + REVIEW_INTERVALS[Math.min(q.reviewCount, 2)] * DAY;
    q.status = 'learning';
  } else {
    q.mastery = Math.max(0, q.mastery - 10);
    q.reviewCount = 0;
    q.nextReviewAt = Date.now() + REVIEW_INTERVALS[0] * DAY;
    q.status = 'new';
  }
  saveVault();
}

$('tbVault').onclick = () => { closeRadial(); openVault(); };
$('vaultClose').onclick = closeVault;
$('vaultReviewBtn').onclick = startReview;
renderVaultBadge();

/* ================= 演示参数（?demo=radial|sidebar|setting|pomo|vault） ================= */
const demo = new URLSearchParams(location.search).get('demo');
if (demo === 'radial')  setTimeout(openRadial, 400);
if (demo === 'sidebar') setTimeout(() => openSidebar(), 400);
if (demo === 'setting') setTimeout(openSettings, 400);
if (demo === 'pomo')    setTimeout(openPomo, 400);
if (demo === 'vault')   setTimeout(openVault, 400);
if (demo === 'review')  setTimeout(() => { startReview(); }, 400);

/* ================= 场景帧动画（JS 驱动：随机 3~10 秒切换 + 眨眼） =================
   防闪黑：每个帧预先渲染成常驻 DOM 的 <img> 图层，src 只设一次、之后永不改动，
   切换只改 opacity —— 不再有「旧图先卸载、新图还没解码」的空白帧。
   切姿态：新层先淡入，盖满之后才隐藏旧层；眨眼：闭眼层临时盖在姿态层之上，
   姿态层全程保持不透明。所以任何时刻画面上都至少有一层完整画面。
   ------------------------------------------------------------------------------ */
const SCENE_FRAMES = [
  { img: 'frames/frame-1.jpg' },   // 思考
  { img: 'frames/frame-2.jpg' },   // 写字
  { img: 'frames/frame-3.jpg' },   // 写字
  { img: 'frames/frame-5.jpg' },   // 思考
  { img: 'frames/frame-12.jpg' }   // 睁眼微笑（眨眼对）
];
const BLINK_CLOSED = 'frames/frame-4.jpg';   // 闭眼（眨眼用）

// 每个帧一个常驻图层；图片只在建层时请求一次，之后靠 opacity 显隐
const layers = {};
function makeLayer(src) {
  const im = document.createElement('img');
  im.className = 'scene-layer';
  im.alt = '';
  im.decoding = 'async';
  im.draggable = false;
  im.src = src;
  scene.appendChild(im);
  return im;
}
SCENE_FRAMES.forEach(f => { layers[f.img] = makeLayer(f.img); });
const blinkLayer = layers[BLINK_CLOSED] || makeLayer(BLINK_CLOSED);

let curFrame = null, frameTimer = null, blinkTimer = null;

/* 把一层提到最上层并淡入；不改它的 src，图片永远不会被重新加载/卸载 */
function fadeIn(el, duration) {
  if (el !== scene.lastElementChild) scene.appendChild(el);   // 排到最后 = 绘制在最上层
  el.style.transitionDuration = duration;
  el.classList.add('show');
}

function pickNext() {
  let i;
  do {
    i = Math.floor(Math.random() * SCENE_FRAMES.length);
  } while (curFrame && SCENE_FRAMES[i].img === curFrame.img && SCENE_FRAMES.length > 1);
  return SCENE_FRAMES[i];
}

function advanceFrame() {
  const f = pickNext();
  const prev = curFrame;
  curFrame = f;
  fadeIn(layers[f.img], '.38s');
  // 新层盖满之后，再隐掉旧姿态层（旧层一直不透明到新层完全显现，故不会闪黑）
  if (prev && prev !== f) {
    setTimeout(() => {
      if (curFrame !== prev) layers[prev.img].classList.remove('show');
    }, 420);
  }
  frameTimer = setTimeout(advanceFrame, 3000 + Math.random() * 7000);   // 3~10 秒随机
  // 轮到睁眼微笑(12)时，随机眨眼一次
  if (f.img.indexOf('frame-12') >= 0 && Math.random() < 0.6) {
    blinkTimer = setTimeout(doBlink, 900 + Math.random() * 1800);
  }
}

function doBlink() {
  const back = curFrame;                        // 记住要睁回的那一帧，绝不跨切到别的姿态
  if (!back) return;
  const backEl = layers[back.img];
  fadeIn(blinkLayer, '.12s');                   // 闭眼：盖上，底层姿态层保持不透明
  setTimeout(() => {                            // 眨眼持续 350ms
    blinkLayer.classList.remove('show');        // 快速淡出，露出下面原本的姿态层
    if (backEl) backEl.classList.add('show');   // 眨眼期间若已切姿态，新姿态层在上层，不会被覆盖回旧帧
  }, 350);
}

// 启动
curFrame = SCENE_FRAMES[Math.floor(Math.random() * SCENE_FRAMES.length)];
fadeIn(layers[curFrame.img], '.38s');
frameTimer = setTimeout(advanceFrame, 3000 + Math.random() * 7000);

</script>
