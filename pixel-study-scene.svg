  <rect x="16" y="18" width="90" height="78" fill="#6a5a7a"/>
  <rect x="20" y="22" width="82" height="70" fill="#171a38"/>
  <!-- 夜空星星 -->
  <rect x="30" y="30" width="2" height="2" fill="#f0e6c8"/>
  <rect x="46" y="40" width="2" height="2" fill="#f0e6c8"/>
  <rect x="38" y="58" width="2" height="2" fill="#f0e6c8"/>
  <rect x="64" y="34" width="2" height="2" fill="#f0e6c8"/>
  <rect x="72" y="62" width="2" height="2" fill="#f0e6c8"/>
