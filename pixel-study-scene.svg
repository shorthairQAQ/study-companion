  <rect x="154" y="76" width="6" height="26" fill="#3a2a3a"/>
  <rect x="190" y="76" width="6" height="26" fill="#3a2a3a"/>
  <!-- 刘海 -->
  <rect x="156" y="70" width="38" height="10" fill="#3a2a3a"/>
  <!-- 帽子 -->
  <rect x="154" y="58" width="42" height="12" fill="#3a6ab8"/>
  <rect x="150" y="68" width="50" height="5" fill="#2a4a8a"/>
  <rect x="188" y="60" width="8" height="6" fill="#4a7ac8"/>
