  <rect x="138" y="106" width="14" height="18" fill="#f0d0b0"/>
  <rect x="198" y="106" width="14" height="18" fill="#f0d0b0"/>

  <!-- ============ 书桌 ============ -->
  <rect x="46" y="122" width="222" height="10" fill="#a06a3a"/>
  <rect x="46" y="122" width="222" height="3" fill="#c08850"/>
  <rect x="54" y="132" width="206" height="14" fill="#6a4528"/>
  <rect x="54" y="132" width="206" height="2" fill="#8a5a38"/>

  <!-- ============ 桌上物品 ============ -->
  <!-- 打开的书 / 笔记本 -->
  <rect x="122" y="114" width="30" height="8" fill="#e8e0d0"/>
  <rect x="122" y="114" width="15" height="8" fill="#f8f4e8"/>
  <rect x="136" y="114" width="2" height="8" fill="#b8a890"/>
  <!-- 笔 -->
  <rect x="152" y="110" width="16" height="2" fill="#c85a4a"/>
  <!-- 水杯 -->
  <rect x="212" y="110" width="10" height="12" fill="#8ab8d0"/>
  <rect x="212" y="112" width="10" height="4" fill="#6a98b0"/>

  <!-- ============ 台灯 ============ -->
  <!-- 光晕 -->
  <circle cx="86" cy="108" r="48" fill="#ffd88a" opacity="0.13"/>
  <!-- 底座 -->
  <rect x="78" y="120" width="20" height="3" fill="#8a7a5a"/>
  <!-- 灯柱 -->
  <rect x="86" y="98" width="4" height="22" fill="#8a7a5a"/>
  <!-- 灯罩 -->
  <rect x="74" y="90" width="28" height="9" fill="#d4a055"/>
  <rect x="74" y="90" width="28" height="3" fill="#e8b878"/>
  <!-- 灯光 -->
  <rect x="78" y="99" width="20" height="4" fill="#ffe8a8" opacity="0.85"/>

  <!-- ============ 整体暖色叠加 ============ -->
  <rect width="320" height="180" fill="#ff9a3a" opacity="0.06"/>
  <!-- 顶部稍暗，突出灯光 -->
  <rect width="320" height="40" fill="#1a1420" opacity="0.18"/>
</svg>
