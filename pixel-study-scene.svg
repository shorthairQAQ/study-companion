  <rect x="230" y="52" width="78" height="4" fill="#5a4436"/>
  <rect x="230" y="94" width="78" height="4" fill="#5a4436"/>
  <!-- 第一层书 -->
  <rect x="236" y="26" width="6" height="26" fill="#c85a4a"/>
  <rect x="244" y="30" width="5" height="22" fill="#4a8a6a"/>
  <rect x="251" y="24" width="7" height="28" fill="#4a6aa8"/>
  <rect x="260" y="28" width="5" height="24" fill="#d4a04a"/>
  <rect x="267" y="32" width="6" height="20" fill="#8a5a8a"/>
  <rect x="275" y="26" width="5" height="26" fill="#5a8a8a"/>
  <!-- 第二层书 -->
  <rect x="236" y="68" width="5" height="26" fill="#d4a04a"/>
  <rect x="243" y="72" width="7" height="22" fill="#c85a4a"/>
  <rect x="252" y="66" width="5" height="28" fill="#4a8a6a"/>
  <rect x="259" y="70" width="6" height="24" fill="#8a5a8a"/>
  <rect x="267" y="74" width="5" height="20" fill="#4a6aa8"/>
  <!-- 第三层 -->
  <rect x="236" y="112" width="7" height="34" fill="#4a6aa8"/>
  <rect x="245" y="116" width="5" height="30" fill="#d4a04a"/>
  <rect x="252" y="110" width="6" height="36" fill="#c85a4a"/>

